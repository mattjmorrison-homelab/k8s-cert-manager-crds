name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: "v1.35.7" # verify against the live cluster's version before merging

      # No Helm chart here (raw CRD YAML, applied with ServerSideApply
      # due to annotation-size limits) -- actions-helm doesn't apply.
      # Same short-lived-token mechanism actions-helm's own check.sh
      # uses internally: mint a token for cert-manager-crds-ci
      # (k8s-ci-rbac#13), then a real server-side dry-run.
      - name: Server-side dry-run against the real cluster
        run: |
          set -euo pipefail
          API=https://kubernetes.default.svc
          CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          RUNNER_TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token

          ci_token=$(kubectl --server="$API" --certificate-authority="$CA" \
            --token="$(cat "$RUNNER_TOKEN")" \
            create token cert-manager-crds-ci -n cert-manager --duration=10m)
          echo "::add-mask::$ci_token"

          kubectl --server="$API" --certificate-authority="$CA" \
            --token="$ci_token" \
            apply --dry-run=server --server-side -f cert-manager.crds.yaml
